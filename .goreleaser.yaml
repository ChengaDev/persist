version: 2

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/ChengaDev/persist/cmd.Version={{.Version}}
    binary: psst

archives:
  - formats:
      - tar.gz
    name_template: "psst_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt

brews:
  - name: psst
    repository:
      owner: ChengaDev
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/ChengaDev/persist"
    description: "Your terminal clipboard — save tokens, secrets, and snippets, retrieve them in one command"
    license: MIT
    install: |
      bin.install "psst"
    test: |
      system "#{bin}/psst", "--version"
