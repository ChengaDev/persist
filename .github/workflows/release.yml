name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache: true

      - name: Build binaries
        run: |
          VERSION=${GITHUB_REF_NAME}
          FLAGS="-s -w -X github.com/ChengaDev/persist/cmd.Version=${VERSION}"
          mkdir -p dist
          GOOS=linux   GOARCH=amd64 go build -ldflags="${FLAGS}" -o dist/psst-linux-amd64       .
          GOOS=linux   GOARCH=arm64 go build -ldflags="${FLAGS}" -o dist/psst-linux-arm64       .
          GOOS=darwin  GOARCH=amd64 go build -ldflags="${FLAGS}" -o dist/psst-darwin-amd64      .
          GOOS=darwin  GOARCH=arm64 go build -ldflags="${FLAGS}" -o dist/psst-darwin-arm64      .
          GOOS=windows GOARCH=amd64 go build -ldflags="${FLAGS}" -o dist/psst-windows-amd64.exe .
          GOOS=windows GOARCH=arm64 go build -ldflags="${FLAGS}" -o dist/psst-windows-arm64.exe .

      - name: Create checksums
        working-directory: dist
        run: sha256sum psst-* > checksums.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/psst-linux-amd64
            dist/psst-linux-arm64
            dist/psst-darwin-amd64
            dist/psst-darwin-arm64
            dist/psst-windows-amd64.exe
            dist/psst-windows-arm64.exe
            dist/checksums.txt
          generate_release_notes: true
