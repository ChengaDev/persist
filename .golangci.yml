linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - misspell

linters-settings:
  errcheck:
    check-type-assertions: true

issues:
  exclude-rules:
    # Ignore unchecked errors in test files.
    - path: _test\.go
      linters:
        - errcheck
    # Ignore deferred close errors (common pattern).
    - text: "Error return value of .*(Close|Flush|Remove).*is not checked"
      linters:
        - errcheck
